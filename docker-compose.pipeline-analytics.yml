# Coolify deploy — agent-pipeline fleet analytics hub
#
# In Coolify (Docker Compose resource):
#   Repository: varutasu/agent-pipeline
#   Branch: docs/walkthroughs-metrics-gate (until merged to main)
#   Base Directory: /   (leave empty — repo root)
#   Docker Compose location: docker-compose.pipeline-analytics.yml
#
# Do NOT set the compose path to analytics/hub/Dockerfile — that is a Dockerfile,
# not a compose file (Coolify will look for Dockerfile/docker-compose.yaml).
#
# Domain: http://pipeline.stillwell.cloud  Port: 3010

services:
  pipeline-analytics:
    build:
      context: .
      dockerfile: analytics/hub/Dockerfile
    container_name: pipeline-analytics
    restart: unless-stopped
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3010/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 5

  # Optional: GitHub metrics pull every 6h. Disable host cron on CT 107 if you use this sidecar.
  pipeline-sync:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      pipeline-analytics:
        condition: service_healthy
    environment:
      SYNC_TOKEN: ${SYNC_TOKEN}
      HUB_URL: http://pipeline-analytics:3010
    volumes:
      - ./analytics/hub/scripts/sync-cron-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
